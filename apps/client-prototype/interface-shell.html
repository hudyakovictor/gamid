<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Signal Arena — Interface Shell</title><style>:root{--bg:#07131c;--surface:#0d202c;--surface2:#102b3a;--surface3:#143747;--line:#214354;--text:#e8f5f8;--muted:#86a7b2;--cyan:#19d9ff;--green:#53f2b2;--gold:#ffd54a;--red:#ff6f91;--shadow:0 16px 60px #0008;--topbar:52px;--font:Inter,"Segoe UI",Roboto,Arial,sans-serif}*{box-sizing:border-box}html,body,#root{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(circle at 50% -10%,#123b4c,var(--bg) 55%);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{height:var(--topbar);flex:0 0 var(--topbar);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px max(10px,calc((100vw - 1180px)/2));background:#07131ceb;border-bottom:1px solid #ffffff12;backdrop-filter:blur(14px);z-index:10}.top-left,.top-right{display:flex;align-items:center;gap:5px;min-width:0}.xp{display:flex;align-items:center;gap:6px;min-width:104px}.label{font-size:10px;letter-spacing:.05em;color:var(--muted)}.xp-track{width:58px;height:5px;background:#18323e;border-radius:99px;overflow:hidden}.xp-track i{display:block;width:64%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:inherit}.profile-button,.balance{display:flex;align-items:center;gap:4px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:#0b1d27;font-size:11px;font-variant-numeric:tabular-nums}.profile-button:hover,.balance:hover,.utility:hover{background:#ffffff10}.pip{color:var(--cyan)}.star{color:var(--gold)}.utility{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:transparent;color:var(--muted);font-size:16px}.badge{position:relative}.badge:after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;background:var(--red);border-radius:50%;box-shadow:0 0 0 2px #07131c}.menu{display:none}.viewport{height:calc(100dvh - var(--topbar));overflow:hidden;padding:clamp(14px,3vw,28px) max(12px,calc((100vw - 1180px)/2));position:relative}.screen{height:100%;overflow:hidden;animation:enter .22s ease}@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.screen-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-bottom:30px}.hero{min-height:360px;display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center}.hero h1{font-size:clamp(38px,6vw,72px);line-height:1.02;margin:8px 0 14px}.hero h1 span{color:var(--cyan)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}.muted{color:var(--muted)}.card{background:linear-gradient(145deg,var(--surface2),#0b1c27);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.two{grid-template-columns:repeat(2,1fr)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{padding:11px 15px;border-radius:10px;font-weight:750}.primary{background:var(--cyan);color:#03131a}.secondary{background:#173646;border:1px solid #2c596b}.primary:hover,.secondary:hover{filter:brightness(1.08);transform:translateY(-1px)}.tag{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted);font-size:12px}.progress{height:7px;background:#07141c;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:64%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:inherit}.route{min-height:145px;display:flex;flex-direction:column;justify-content:space-between}.route .secondary{align-self:flex-start}.module{min-height:175px}.locked{opacity:.52}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff0d}.list{display:grid;gap:8px}.source{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#0b202b;text-align:left}.source:hover{border-color:var(--cyan)}.workspace{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:13px;min-height:0}.workspace-main,.workspace-side{min-height:0;display:flex;flex-direction:column;gap:13px}.chart-card{flex:1;min-height:0}.chart-placeholder{height:100%;min-height:260px;display:grid;place-items:center;border:1px dashed #427286;border-radius:11px;background:linear-gradient(180deg,#102b3a,#081720);color:var(--muted)}.rail{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;padding-bottom:3px}.rail>*{scroll-snap-align:start;flex:0 0 auto}.rail button{padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#0b202b;color:var(--muted)}.rail button.active{border-color:var(--cyan);color:var(--text)}.shell{border:1px dashed #426778;border-radius:13px;padding:14px;background:#081923}.shell-body{min-height:104px;display:grid;place-items:center;border:1px dashed #2d5869;border-radius:9px;background:repeating-linear-gradient(135deg,#0b202b,#0b202b 12px,#0d2531 12px,#0d2531 24px);color:var(--muted);text-align:center}.decision-dock{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#0b202b}.decision-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.decision-actions button{padding:11px;border:1px solid var(--line);border-radius:8px;background:#0b202b}.decision-actions button.active,.decision-actions button:hover{border-color:var(--cyan);background:#123a49}.stepper{display:flex;gap:6px;margin:8px 0}.stepper i{height:5px;flex:1;border-radius:99px;background:#1b3440}.stepper i.on{background:var(--cyan)}.bottom{display:flex;justify-content:space-between;gap:9px;margin-top:12px}.modal-layer{position:fixed;inset:0;z-index:30;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}.panel-surface{width:min(540px,100%);max-height:min(720px,calc(100dvh - 32px));display:flex;flex-direction:column;background:var(--surface2);border:1px solid var(--cyan);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-header h2{font-size:18px;margin:0}.panel-header .close{margin-left:auto}.handle{display:none;width:38px;height:4px;border-radius:99px;background:#7a9ca8;margin:5px auto 0}.panel-scroll{overflow-y:auto;overscroll-behavior:contain;padding:16px;min-height:0}.close{width:34px;height:34px;background:transparent;color:var(--muted);font-size:22px;border-radius:8px}.close:hover{background:#ffffff10;color:var(--text)}.panel-footer{flex:0 0 auto;padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:9px}.empty-state{min-height:180px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:16px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;padding:12px 14px;background:#123746;border:1px solid var(--cyan);border-radius:10px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}@media(max-width:820px){.hero{grid-template-columns:1fr}.grid,.two{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.workspace-side{display:none}.menu{display:grid}.profile-button b{display:none}.xp{min-width:0}.xp-track{width:52px}.label{display:none}}@media(max-width:520px){:root{--topbar:48px}.top{padding:5px 7px;gap:3px}.top-left,.top-right{gap:2px}.profile-button{border:0;background:transparent;padding:5px 2px}.profile-button span{display:none}.balance{border:0;background:transparent;padding:5px 2px}.utility{width:27px;height:27px;font-size:15px}.utility.paperclip{display:none}.grid,.two{grid-template-columns:1fr}.hero{min-height:0;padding:12px 0}.hero h1{font-size:43px}.viewport{padding:12px 10px}.chart-placeholder{min-height:210px}.decision-dock{position:sticky;bottom:0}.panel-layer{align-items:flex-end;padding:0}.panel-surface{width:100%;max-height:92dvh;border-radius:18px 18px 0 0;border-bottom:0}.handle{display:block}.panel-header{padding-top:4px}.panel-scroll{padding-bottom:calc(16px + env(safe-area-inset-bottom))}.panel-footer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div id="root"></div><script>
const state={screen:'preload',panel:null,action:null,step:1,slide:{academy:0,mission:0,skills:0}};
const slides={academy:[['CURRENT','Breakout Validation','Structure · Confirmation · Invalidation'],['REMATCH','Price Structure','Spaced practice shell is ready'],['LOCKED','Flow & Derivatives','Unlock after current module']],mission:[['ACADEMY','False Breakout','Guided · Price + Flow · Beginner'],['REMATCH','Post-Loss Discipline','Practice shell · 8 min'],['ARENA','Multi-Entity Conflict','Requires 3 verified cards']],skills:[['CARD 1','Market Structure','Reading card shell'],['CARD 2','Volume Confirmation','Evidence card shell'],['CARD 3','Wait for Retest','Protocol card shell'],['CARD 4','Define Invalidation','Defense card shell']]};
const panelTitles={price:'PRICE Source Group',flow:'FLOW Source Group',cards:'Skill Hand',decision:'Decision Sheet',attachments:'Attachments',notifications:'Notifications',settings:'Settings',menu:'Navigation',quality:'Decision Quality'};
function top(){return `<header class="top"><div class="top-left"><div class="xp" aria-label="XP progress"><span class="label">XP</span><span class="xp-track"><i></i></span><span class="label">7</span></div><button class="profile-button" onclick="go('profile')" aria-label="Open profile"><span>♙</span><b>Profile</b></button></div><div class="top-right"><div class="balance" title="Pips"><span class="pip">◆</span>128</div><div class="balance" title="Stars"><span class="star">★</span>799</div><button class="utility paperclip" onclick="openPanel('attachments')" aria-label="Attachments" title="Attachments">📎</button><button class="utility badge" onclick="openPanel('notifications')" aria-label="Notifications" title="Notifications">✉</button><button class="utility" onclick="openPanel('settings')" aria-label="Settings" title="Settings">⚙</button><button class="utility menu" onclick="openPanel('menu')" aria-label="Open menu" title="Menu">☰</button></div></header>`}
function shell(content){return `<div class="app">${state.screen==='preload'?'':top()}<main class="viewport">${content}</main>${state.panel?panel():''}</div>`}
function go(screen){state.screen=screen;state.panel=null;state.step=1;render()}
function openPanel(name){state.panel=name;document.body.classList.add('panel-open');render()}
function closePanel(){state.panel=null;document.body.classList.remove('panel-open');render()}
function keydown(e){if(e.key==='Escape'&&state.panel)closePanel();if(e.key==='ArrowLeft')shift('academy',-1);if(e.key==='ArrowRight')shift('academy',1)}
function panel(){let title=panelTitles[state.panel]||state.panel.toUpperCase();return `<div class="modal-layer" onclick="closePanel()"><section class="panel-surface" role="dialog" aria-modal="true" aria-labelledby="panel-title" onclick="event.stopPropagation()"><div class="handle"></div><header class="panel-header"><div><div class="eyebrow">Panel shell</div><h2 id="panel-title">${title}</h2></div><button class="close" onclick="closePanel()" aria-label="Close panel">×</button></header><div class="panel-scroll"><div class="empty-state">Internal panel content intentionally omitted.<br><small>Shell boundary only · scroll container ready.</small></div><div style="height:280px;display:grid;place-items:center;color:var(--muted)">Reserved content area</div></div><footer class="panel-footer"><span class="tag">Backdrop · Escape · Back · X</span><button class="primary" onclick="closePanel()">Close</button></footer></section></div>`}
function preload(){setTimeout(()=>go('home'),1200);return `<div class="screen" style="height:100%;display:grid;place-items:center;text-align:center"><div><h1 style="margin:0">SIGNAL <span style="color:var(--cyan)">ARENA</span></h1><p class="muted">Loading interface shell…</p><div class="progress" style="width:260px;margin:auto"><i style="width:100%"></i></div></div></div>`}
function rail(kind){let items=slides[kind],index=state.slide[kind==='skills'?'skills':kind];let x=items[index];return `<div class="card"><div class="section-title"><h3>${kind==='skills'?'Skill Hand':kind==='academy'?'Academy route':'Mission deck'}</h3><span class="tag">${index+1} / ${items.length}</span></div><div class="shell"><span class="tag">${x[0]}</span><h3>${x[1]}</h3><p class="muted">${x[2]}</p><div class="progress"><i style="width:${kind==='academy'?64:32}%"></i></div></div><div class="bottom"><button class="secondary" onclick="shift('${kind}',-1)" ${index===0?'disabled':''}>Previous</button><button class="secondary" onclick="shift('${kind}',1)" ${index===items.length-1?'disabled':''}>Next</button></div></div>`}
function shift(kind,delta){let key=kind==='skills'?'skills':kind;let max=slides[kind].length-1;state.slide[key]=Math.max(0,Math.min(max,state.slide[key]+delta));render()}
function home(){return shell(`<div class="screen-scroll"><section class="hero"><div><div class="eyebrow">Decision training arena</div><h1>See what<br><span>matters.</span></h1><p class="muted">A focused interface shell for evidence-first decisions. No page scroll: only panels and content regions scroll.</p><div class="actions"><button class="primary" onclick="go('academy')">Start Academy</button><button class="secondary" onclick="go('mission')">Quick Mission</button></div></div><div class="card"><div class="eyebrow">Current route</div><h2>Breakout Validation</h2><p class="muted">Next: Scenario Brief → Decision Workspace</p><div class="progress"><i></i></div><p class="muted">Player Level 7 · 64% module progress</p></div></section><div class="section-title"><h2>Routes</h2><span class="tag">interface shell</span></div><div class="grid"><div class="card route"><div><h3>Academy</h3><p class="muted">Guided lessons.</p></div><button class="secondary" onclick="go('academy')">Open</button></div><div class="card route"><div><h3>Mission</h3><p class="muted">Scenario selection.</p></div><button class="secondary" onclick="go('mission')">Open</button></div><div class="card route"><div><h3>Profile</h3><p class="muted">Decision trace.</p></div><button class="secondary" onclick="go('profile')">Open</button></div></div><div class="footer">Compact one-row top bar · panel interiors intentionally deferred</div></div>`)}
function academy(){return shell(`<div class="screen-scroll"><div class="eyebrow">Academy</div><div class="section-title"><h1>Learning route</h1><span class="tag">Level 7</span></div>${rail('academy')}<div class="section-title"><h2>Module shell</h2></div><div class="grid two"><div class="card"><h3>Guided example</h3><div class="shell-body">Worked example panel</div></div><div class="card"><h3>Practice</h3><div class="shell-body">Practice panel</div></div></div></div>`)}
function mission(){return shell(`<div class="screen-scroll"><div class="eyebrow">Missions</div><div class="section-title"><h1>Choose scenario</h1><span class="tag">3 available</span></div>${rail('mission')}<div class="section-title"><h2>Scenario formats</h2></div><div class="grid"><div class="card"><span class="tag">PRE-ENTRY</span><h3>Read the setup</h3></div><div class="card"><span class="tag">POST-LOSS</span><h3>Protect the process</h3></div><div class="card locked"><span class="tag">LOCKED</span><h3>Conflict</h3></div></div></div>`)}
function brief(){return shell(`<div class="screen-scroll"><div class="eyebrow">Scenario Brief</div><div class="section-title"><h1>Is the breakout confirmed?</h1><span class="tag">BEGINNER · 8 MIN</span></div><div class="grid two"><div class="card"><div class="row"><span class="muted">Asset</span><b>BTC/USDT</b></div><div class="row"><span class="muted">Timeframe</span><b>1h</b></div><div class="row"><span class="muted">Decision point</span><b>t0</b></div><div class="row"><span class="muted">Format</span><b>Pre-entry</b></div></div><div class="card"><h3>Source groups</h3><div class="list"><button class="source" onclick="openPanel('price')">PRICE <span class="tag">panel</span></button><button class="source" onclick="openPanel('flow')">FLOW <span class="tag">panel</span></button><button class="source" onclick="openPanel('cards')">SKILL HAND <span class="tag">panel</span></button></div></div></div><div class="bottom"><button class="secondary" onclick="go('mission')">Back</button><button class="primary" onclick="go('workspace')">Enter workspace</button></div></div>`)}
function workspace(){return shell(`<div class="screen"><div class="eyebrow">Decision Workspace · Step ${state.step}/4</div><div class="stepper">${[1,2,3,4].map(x=>`<i class="${x<=state.step?'on':''}"></i>`).join('')}</div><div class="workspace"><div class="workspace-main"><div class="card chart-card"><div class="section-title"><h2>Chart Frame</h2><button class="utility" onclick="openPanel('settings')" aria-label="Workspace settings">⚙</button></div><div class="chart-placeholder">CandleChart shell<br><small>t0 · future segment hidden · renderer boundary</small></div><div class="rail" style="margin-top:10px"><button onclick="openPanel('price')">⌁ PRICE</button><button onclick="openPanel('flow')">◈ FLOW</button><button onclick="openPanel('cards')">◆ CARDS</button></div></div><div class="decision-dock"><span><b>${state.action||'Choose action'}</b><small class="muted"> · Step ${state.step}/4</small></span><button class="secondary" onclick="openPanel('decision')">Open Decision Sheet</button></div></div><aside class="workspace-side"><div class="card">${rail('skills')}</div><div class="card"><div class="section-title"><h3>Decision Sheet</h3><button class="utility" onclick="openPanel('decision')" aria-label="Open Decision Sheet">↗</button></div><div class="shell-body">Entry · Risk · Confidence<br>fields intentionally omitted</div><div class="decision-actions" style="margin-top:10px">${['LONG','SHORT','WAIT','NO TRADE'].map(a=>`<button class="${state.action===a?'active':''}" onclick="choose('${a}')">${a}</button>`).join('')}</div></div></aside></div><div class="bottom"><button class="secondary" onclick="go('brief')">Back</button><button class="primary" onclick="advance()">${state.step>=4?'Seal shell':'Continue'}</button></div></div>`)}
function choose(a){state.action=a;render()}
function advance(){if(state.step<4){state.step++;render()}else go('reveal')}
function reveal(){return shell(`<div class="screen-scroll"><div class="eyebrow">Historical Reveal</div><div class="section-title"><h1>Reveal shell</h1><span class="tag">FUTURE DATA</span></div><div class="grid two"><div class="card"><div class="shell"><div class="shell-head"><b>Future segment</b><span class="tag">revealed</span></div><div class="shell-body">Reveal animation placeholder</div></div></div><div class="card"><div class="shell"><div class="shell-head"><b>Entity</b><span class="tag">hidden → visible</span></div><div class="shell-body">Entity reveal placeholder</div></div></div></div><div class="actions"><button class="secondary" onclick="go('workspace')">Back</button><button class="primary" onclick="go('debrief')">Continue to debrief</button></div></div>`)}
function debrief(){return shell(`<div class="screen-scroll"><div class="eyebrow">Debrief</div><div class="section-title"><h1>Decision resolved</h1><span class="tag">SCORE SHELL</span></div><div class="grid"><div class="card"><div class="shell"><h3>Market Fact</h3><div class="shell-body">Fact panel placeholder</div></div></div><div class="card"><div class="shell"><h3>Plan Consequence</h3><div class="shell-body">Consequence panel placeholder</div></div></div><div class="card"><div class="shell"><h3>Decision Quality</h3><div class="shell-body">Quality panel placeholder</div></div></div></div><div class="actions"><button class="secondary" onclick="openPanel('quality')">Open quality panel</button><button class="primary" onclick="go('home')">Finish</button></div></div>`)}
function profile(){return shell(`<div class="screen-scroll"><div class="eyebrow">Profile</div><div class="section-title"><h1>Decision Trace shell</h1><span class="tag">Player Level 7</span></div><div class="grid"><div class="card"><h3>Progress</h3><div class="progress"><i></i></div><p class="muted">Aggregate competence placeholder</p></div><div class="card"><h3>Weak pattern</h3><div class="shell-body">Insight placeholder</div></div><div class="card"><h3>History</h3><div class="shell-body">Encounter list placeholder</div></div></div></div>`)}
function collection(){return shell(`<div class="screen-scroll"><div class="eyebrow">Collection</div><div class="section-title"><h1>Entities & mastery</h1><span class="tag">4 / 40</span></div><div class="grid">${['Wick Mimic','Fake Breakout Phantom','FOMO Wraith','Liquidity Hydra'].map((n,i)=>`<div class="card ${i>1?'locked':''}"><span class="tag">${i<2?'IDENTIFIED':'UNKNOWN PATTERN'}</span><h3>${n}</h3><div class="shell-body">Entity panel placeholder</div></div>`).join('')}</div></div>`)}
function store(){return shell(`<div class="screen-scroll"><div class="eyebrow">Pip Shop</div><div class="section-title"><h1>Store shell</h1><span class="balance"><span class="pip">◆</span>128</span></div><div class="grid"><div class="card"><h3>Cosmetic</h3><div class="shell-body">Catalog placeholder</div></div><div class="card"><h3>Learning access</h3><div class="shell-body">Entitlement placeholder</div></div><div class="card"><h3>Rematch</h3><div class="shell-body">Convenience placeholder</div></div></div></div>`)}
function render(){document.getElementById('root').innerHTML=state.screen==='preload'?preload():({home,academy,mission,brief,workspace,reveal,debrief,profile,collection,store}[state.screen]||home)()}
window.addEventListener('keydown',keydown);render();
</script></body></html>
