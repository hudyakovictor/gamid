<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signal Arena — Interface Shell</title>
<style>
:root{--bg:#07131c;--panel:#0d202c;--panel2:#102b3a;--line:#214354;--text:#e8f5f8;--muted:#86a7b2;--cyan:#19d9ff;--green:#53f2b2;--gold:#ffd54a;--red:#ff6f91;--purple:#b58cff;--shadow:0 18px 60px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#123b4c,#07131c 55%);color:var(--text);font:15px/1.45 system-ui,sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.app{min-height:100vh}.top{height:52px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px max(10px,calc((100vw - 1180px)/2));background:#07131ceb;border-bottom:1px solid #ffffff12;backdrop-filter:blur(14px)}.top-left,.top-right{display:flex;align-items:center;gap:5px;min-width:0}.top-right{justify-content:flex-end}.xp{display:flex;align-items:center;gap:6px;min-width:104px}.xp-label{font-size:10px;color:var(--muted);letter-spacing:.04em}.xp-track{width:58px;height:5px;background:#18323e;border-radius:99px;overflow:hidden}.xp-track i{display:block;width:64%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:inherit}.profile-button{display:flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:#0b1d27;color:var(--text);font-size:11px}.profile-button b{font-size:11px;font-weight:700}.balance{display:flex;align-items:center;gap:4px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:#0b1d27;font-size:11px;font-variant-numeric:tabular-nums}.pip{color:var(--cyan)}.star{color:var(--gold)}.utility{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:transparent;color:var(--muted);font-size:16px}.utility:hover,.profile-button:hover,.balance:hover{background:#ffffff10;color:var(--text)}.utility.has-badge{position:relative}.utility.has-badge:after{content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #07131c}.menu-button{display:none}main{width:min(1180px,100%);margin:auto;padding:22px 16px 55px}.screen{animation:show .25s ease}@keyframes show{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.hero{padding:40px 0;display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center}.hero h1{font-size:clamp(36px,7vw,76px);line-height:.98;margin:9px 0 16px}.hero h1 span{color:var(--cyan)}.muted{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.primary,.secondary{padding:12px 16px;border-radius:11px;font-weight:800}.primary{background:var(--cyan);color:#03131a}.secondary{background:#173646;border:1px solid #2c596b}.primary:hover,.secondary:hover{filter:brightness(1.1);transform:translateY(-1px)}.card{background:linear-gradient(145deg,#102b3a,#0b1c27);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid.two{grid-template-columns:repeat(2,1fr)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:21px 0 11px}.tag{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px}.progress{height:8px;border-radius:99px;background:#07141c;overflow:hidden}.progress i{display:block;width:64%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--green))}.route{min-height:145px;display:flex;flex-direction:column;justify-content:space-between}.route .secondary{align-self:flex-start}.list{display:grid;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px;border-bottom:1px solid #ffffff0d}.module{min-height:170px}.module h3{margin:12px 0 6px}.locked{opacity:.55}.shell{border:1px dashed #426778;border-radius:16px;padding:18px;background:#081923}.shell-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.shell-body{min-height:125px;display:grid;place-items:center;border:1px dashed #2d5869;border-radius:11px;background:repeating-linear-gradient(135deg,#0b202b,#0b202b 12px,#0d2531 12px,#0d2531 24px);color:var(--muted);text-align:center}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.chart-shell{min-height:400px}.chart-placeholder{height:315px;border-radius:12px;border:1px dashed #427286;display:grid;place-items:center;background:linear-gradient(180deg,#102b3a,#081720);color:var(--muted)}.tray{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tray button{padding:9px 10px;border-radius:9px;background:#102d3b;border:1px solid var(--line);color:var(--muted)}.tray button.active{border-color:var(--cyan);color:var(--text)}.decision-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.decision-actions button{padding:13px;border-radius:9px;background:#0b202b;border:1px solid var(--line)}.decision-actions button:hover,.decision-actions button.active{border-color:var(--cyan);background:#123a49}.stepper{display:flex;gap:7px;margin:12px 0}.stepper i{height:6px;flex:1;border-radius:99px;background:#1b3440}.stepper i.on{background:var(--cyan)}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:15px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:20}.modal-card{width:min(520px,100%);background:#102b3a;border:1px solid var(--cyan);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.close{float:right;background:none;color:var(--muted);font-size:20px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:35px}@media(max-width:820px){.hero{grid-template-columns:1fr}.grid,.grid.two{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.top{padding-inline:8px}.xp{min-width:0}.xp-label{display:none}.xp-track{width:52px}.profile-button b{display:none}.balance{padding:5px}.menu-button{display:grid}.utility{width:29px;height:29px;font-size:15px}}@media(max-width:500px){main{padding:14px 11px 40px}.grid,.grid.two{grid-template-columns:1fr}.hero h1{font-size:43px}.chart-placeholder{height:240px}.shell-body{min-height:100px}.workspace{display:block}.workspace>.card{margin-top:12px}.top{height:48px;padding:5px 7px;gap:4px}.top-left,.top-right{gap:2px}.balance{border:0;background:transparent;padding:5px 2px}.utility{width:27px;height:27px;font-size:15px}.utility.paperclip{display:none}.xp-track{width:42px}.profile-button{border:0;background:transparent;padding:5px 2px}.profile-button span{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><div id="root"></div><script>
const state={screen:'preload',panel:null,toast:null,action:null,step:1};
function top(){return `<header class="top"><div class="top-left"><div class="xp" aria-label="XP progress"><span class="xp-label">XP</span><span class="xp-track"><i></i></span><span class="xp-label">7</span></div><button class="profile-button" onclick="go('profile')" aria-label="Open profile"><span>♙</span><b>Profile</b></button></div><div class="top-right"><div class="balance" title="Pips"><span class="pip">◆</span><span>128</span></div><div class="balance" title="Stars"><span class="star">★</span><span>799</span></div><button class="utility paperclip" onclick="openPanel('attachments')" aria-label="Attachments" title="Attachments">📎</button><button class="utility has-badge" onclick="openPanel('notifications')" aria-label="Notifications" title="Notifications">✉</button><button class="utility" onclick="openPanel('settings')" aria-label="Settings" title="Settings">⚙</button><button class="utility menu-button" onclick="openPanel('menu')" aria-label="Open menu" title="Menu">☰</button></div></header>`}
function shell(content){return `<div class="app">${state.screen==='preload'?'':top()}<main>${content}</main>${state.panel?panel():''}${state.toast?`<div class="toast">${state.toast}</div>`:''}</div>`}
function go(s){state.screen=s;state.panel=null;state.step=1;render()}
function openPanel(name){state.panel=name;render()}
function closePanel(){state.panel=null;render()}
function panel(){let names={helper:'THE HELPER',pause:'PAUSE MENU',price:'PRICE SOURCE GROUP',flow:'FLOW SOURCE GROUP',cards:'SKILL HAND',decision:'DECISION SHEET',market:'MARKET FACT',quality:'DECISION QUALITY',attachments:'ATTACHMENTS',notifications:'NOTIFICATIONS',settings:'SETTINGS',menu:'NAVIGATION'};return `<div class="modal" onclick="closePanel()"><section class="modal-card" onclick="event.stopPropagation()"><button class="close" onclick="closePanel()" aria-label="Close panel">×</button><div class="eyebrow">Panel shell · ${names[state.panel]||'PANEL'}</div><h2>${names[state.panel]||'Panel'}</h2><div class="shell-body">Internal panel content intentionally omitted.<br><small>Prototype boundary: interface and state only.</small></div><div class="bottom"><span class="tag">${state.panel==='menu'?'compact route menu':'overlay / bottom-sheet ready'}</span><button class="primary" onclick="closePanel()">Close</button></div></section></div>`}
function preload(){setTimeout(()=>go('home'),1600);return `<div class="screen" style="min-height:100vh;display:grid;place-items:center;text-align:center"><div><div style="font-size:42px;font-weight:900;letter-spacing:.1em">SIGNAL <span style="color:var(--cyan)">ARENA</span></div><p class="muted">Loading interface shell…</p><div class="progress" style="width:280px;margin:auto"><i style="width:100%"></i></div></div></div>`}
function home(){return shell(`<section class="hero screen"><div><div class="eyebrow">Decision training arena</div><h1>See what<br><span>matters.</span></h1><p class="muted">Compact one-row utility top bar: XP and profile on the left, balances and utilities on the right.</p><div class="actions"><button class="primary" onclick="go('academy')">Start Academy</button><button class="secondary" onclick="go('mission')">Quick Mission</button></div></div><div class="card"><div class="eyebrow">Current route</div><h2>Breakout Validation</h2><p class="muted">Next: Scenario Brief → Decision Workspace</p><div class="progress"><i></i></div><p class="small muted">Player Level 7 · 64% module progress</p></div></section><div class="section-title"><h2>Main routes</h2><span class="tag">compact shell v0.4</span></div><div class="grid"><div class="card route"><div><h3>Academy</h3><p class="muted">Guided lessons and module progression.</p></div><button class="secondary" onclick="go('academy')">Open</button></div><div class="card route"><div><h3>Mission</h3><p class="muted">Scenario selection and brief shell.</p></div><button class="secondary" onclick="go('mission')">Open</button></div><div class="card route"><div><h3>Profile</h3><p class="muted">Decision trace and player state.</p></div><button class="secondary" onclick="go('profile')">Open</button></div></div><div class="footer">One-row top bar · no logo · panel interiors remain placeholders</div>`)}
function academy(){return shell(`<div class="screen"><div class="eyebrow">Academy</div><div class="section-title"><h1>Learning route</h1><span class="tag">Level 7</span></div><div class="grid"><div class="card module"><span class="tag">CURRENT</span><h3>Breakout Validation</h3><p class="muted">Structure · Confirmation · Invalidation</p><div class="progress"><i></i></div><div class="bottom"><span class="small muted">64% · 12 min</span><button class="primary" onclick="go('brief')">Continue</button></div></div><div class="card module"><span class="tag">REMATCH</span><h3>Price Structure</h3><p class="muted">Spaced practice shell is ready.</p><button class="secondary" onclick="go('brief')">Practice</button></div><div class="card module locked"><span class="tag">LOCKED</span><h3>Flow & Derivatives</h3><p class="muted">Unlock after current module.</p><button class="secondary" disabled>Locked</button></div></div></div>`)}
function mission(){return shell(`<div class="screen"><div class="eyebrow">Missions</div><div class="section-title"><h1>Choose scenario</h1><span class="tag">3 available</span></div><div class="grid"><div class="card module"><span class="tag">ACADEMY</span><h3>False Breakout</h3><p class="muted">Guided · Price + Flow · Beginner</p><button class="primary" onclick="go('brief')">View brief</button></div><div class="card module"><span class="tag">REMATCH</span><h3>Post-Loss Discipline</h3><p class="muted">Practice shell · 8 min</p><button class="secondary" onclick="go('brief')">View brief</button></div><div class="card module locked"><span class="tag">ARENA</span><h3>Multi-Entity Conflict</h3><p class="muted">Requires 3 verified cards.</p><button class="secondary" disabled>Locked</button></div></div></div>`)}
function brief(){return shell(`<div class="screen"><div class="eyebrow">Scenario Brief</div><div class="section-title"><h1>Is the breakout confirmed?</h1><span class="tag">BEGINNER · 8 MIN</span></div><div class="grid two"><div class="card"><div class="row"><span class="muted">Asset</span><b>BTC/USDT</b></div><div class="row"><span class="muted">Timeframe</span><b>1h</b></div><div class="row"><span class="muted">Decision point</span><b>t0</b></div><div class="row"><span class="muted">Format</span><b>Pre-entry</b></div></div><div class="card"><h3>Available interface</h3><div class="list"><button class="source" onclick="openPanel('price')">PRICE <span class="tag">panel</span></button><button class="source" onclick="openPanel('flow')">FLOW <span class="tag">panel</span></button><button class="source" onclick="openPanel('cards')">SKILL HAND <span class="tag">panel</span></button></div></div></div><div class="actions"><button class="secondary" onclick="go('mission')">Back</button><button class="primary" onclick="go('workspace')">Enter workspace</button></div></div>`)}
function workspace(){return shell(`<div class="screen"><div class="eyebrow">Decision Workspace · Step ${state.step}/4</div><div class="stepper">${[1,2,3,4].map(x=>`<i class="${x<=state.step?'on':''}"></i>`).join('')}</div><div class="workspace"><div><div class="card chart-shell"><div class="section-title"><h2>Chart Frame</h2><button class="utility" onclick="openPanel('pause')" aria-label="Pause">Ⅱ</button></div><div class="chart-placeholder">CandleChart placeholder<br><small>t0 · future segment hidden · renderer boundary</small></div><div class="tray"><button onclick="openPanel('price')">⌁ PRICE</button><button onclick="openPanel('flow')">◈ FLOW</button><button onclick="openPanel('cards')">◆ CARDS</button></div></div><div class="card" style="margin-top:14px"><div class="section-title"><h3>Source Tray</h3><span class="tag">2 / 5 groups</span></div><p class="muted">Source buttons open panel shells only.</p></div></div><aside><div class="card"><div class="section-title"><h3>Skill Hand</h3><button class="utility" onclick="openPanel('cards')" aria-label="Open Skill Hand">↗</button></div><div class="shell"><div class="shell-head"><span>Cards panel</span><span class="tag">4 slots</span></div><div class="shell-body">Card content placeholder</div></div></div><div class="card" style="margin-top:14px"><div class="section-title"><h3>Decision Sheet</h3><button class="utility" onclick="openPanel('decision')" aria-label="Open Decision Sheet">↗</button></div><div class="shell"><div class="shell-head"><span>Decision panel</span><span class="tag">required</span></div><div class="shell-body">Entry · Risk · Confidence<br>fields intentionally omitted</div></div><div class="decision-actions" style="margin-top:12px">${['LONG','SHORT','WAIT','NO TRADE'].map(a=>`<button class="${state.action===a?'active':''}" onclick="choose('${a}')">${a}</button>`).join('')}</div></div></aside></div><div class="bottom"><button class="secondary" onclick="go('brief')">Back</button><button class="primary" onclick="advance()">${state.step>=4?'Seal shell':'Continue'}</button></div></div>`)}
function choose(a){state.action=a;render()}
function advance(){if(state.step<4){state.step++;render()}else go('reveal')}
function reveal(){return shell(`<div class="screen"><div class="eyebrow">Historical Reveal</div><div class="section-title"><h1>Reveal shell</h1><span class="tag">FUTURE DATA</span></div><div class="grid two"><div class="card"><div class="shell"><div class="shell-head"><span>Future segment</span><span class="tag">revealed</span></div><div class="shell-body">Reveal animation placeholder</div></div></div><div class="card"><div class="shell"><div class="shell-head"><span>Entity</span><span class="tag">hidden → visible</span></div><div class="shell-body">Entity reveal placeholder</div></div></div></div><div class="actions"><button class="secondary" onclick="go('workspace')">Back</button><button class="primary" onclick="go('debrief')">Continue to debrief</button></div></div>`)}
function debrief(){return shell(`<div class="screen"><div class="eyebrow">Debrief</div><div class="section-title"><h1>Decision resolved</h1><span class="tag">SCORE SHELL</span></div><div class="grid"><div class="card"><div class="shell"><div class="shell-head"><b>Market Fact</b><span class="tag">panel</span></div><div class="shell-body">Fact content placeholder</div></div></div><div class="card"><div class="shell"><div class="shell-head"><b>Plan Consequence</b><span class="tag">panel</span></div><div class="shell-body">Consequence placeholder</div></div></div><div class="card"><div class="shell"><div class="shell-head"><b>Decision Quality</b><span class="tag">panel</span></div><div class="shell-body">Quality placeholder</div></div></div></div><div class="actions"><button class="secondary" onclick="openPanel('quality')">Open quality panel</button><button class="primary" onclick="go('home')">Finish</button></div></div>`)}
function profile(){return shell(`<div class="screen"><div class="eyebrow">Profile</div><div class="section-title"><h1>Decision Trace shell</h1><span class="tag">Player Level 7</span></div><div class="grid"><div class="card"><h3>Progress</h3><div class="progress"><i style="width:64%"></i></div><p class="muted">Aggregate competence placeholder</p></div><div class="card"><h3>Weak pattern</h3><div class="shell-body">Insight panel placeholder</div></div><div class="card"><h3>History</h3><div class="shell-body">Encounter list placeholder</div></div></div></div>`)}
function collection(){return shell(`<div class="screen"><div class="eyebrow">Collection</div><div class="section-title"><h1>Entities & mastery</h1><span class="tag">4 / 40</span></div><div class="grid">${['Wick Mimic','Fake Breakout Phantom','FOMO Wraith','Liquidity Hydra'].map((n,i)=>`<div class="card ${i>1?'locked':''}"><span class="tag">${i<2?'IDENTIFIED':'UNKNOWN PATTERN'}</span><h3>${n}</h3><div class="shell-body">Entity panel placeholder</div></div>`).join('')}</div></div>`)}
function store(){return shell(`<div class="screen"><div class="eyebrow">Pip Shop</div><div class="section-title"><h1>Store shell</h1><span class="wallet"><span class="pip">◆</span>128</span></div><div class="grid"><div class="card"><h3>Cosmetic</h3><div class="shell-body">Catalog panel placeholder</div></div><div class="card"><h3>Learning access</h3><div class="shell-body">Entitlement panel placeholder</div></div><div class="card"><h3>Rematch</h3><div class="shell-body">Convenience panel placeholder</div></div></div></div>`)}
function render(){document.getElementById('root').innerHTML=state.screen==='preload'?preload():({home,academy,mission,brief,workspace,reveal,debrief,profile,collection,store}[state.screen]||home)()}
render();
</script></body></html>
